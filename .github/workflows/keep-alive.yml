name: keep-supabase-alive

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: อ่านข้อมูลเบาๆ เพื่อให้โปรเจกต์ไม่ถูกพัก
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "ความยาวของ key: ${#SUPABASE_ANON_KEY}"
          echo "ความยาวของ URL: ${#SUPABASE_URL}"
          curl -sS -w "\nHTTP %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/drops?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY"
